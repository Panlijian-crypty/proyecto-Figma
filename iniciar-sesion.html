<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Pantalla de inicio de sesión de GlobalTicket basada en el diseño de Figma.">
        <title>
            Iniciar sesión | GlobalTicket
        </title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="gt-site gt-login-page">
        <div class="gt-page">
            <header class="gt-header">
                <div class="gt-container gt-header-inner">
                    <a class="gt-brand" href="crear-cuenta.html">
                        GLOBALTICKET
                    </a>
                    <div class="gt-search" role="search" aria-label="Buscar en GlobalTicket">
                        <img src="img/buscar.png" width="19" height="19" alt="">
                        <input type="search" name="busqueda" placeholder="Buscar un puesto" aria-label="Buscar un puesto">
                    </div>
                    <nav class="gt-account-nav" aria-label="Acceso a la cuenta">
                        <a class="gt-button gt-signin" href="crear-cuenta.html">
                            Regístrate
                        </a>
                    </nav>
                    <img class="gt-avatar" src="img/avatar-login.png" width="40" height="40" alt="Avatar de usuario">
                </div>
            </header>
            <main class="gt-main">
                <section class="gt-registration" aria-labelledby="gt-login-heading">
                    <h1 class="gt-title" id="gt-login-heading">
                        Iniciar sesión
                    </h1>
                    <form class="gt-form" aria-describedby="gt-form-note" aria-label="Iniciar sesión">
                        <div class="gt-field">
                            <label for="gt-email">
                                Correo electrónico
                            </label>
                            <input id="gt-email" name="correo" autocomplete="username" type="email" placeholder="nombre@correo.com" required>
                        </div>
                        <div class="gt-field">
                            <label for="gt-password">
                                Contraseña
                            </label>
                            <input id="gt-password" name="contrasena" autocomplete="current-password" type="password" placeholder="Tu contraseña" required>
                        </div>
                        <div class="gt-actions">
                            <button class="gt-button gt-register" type="button">
                                Iniciar sesión
                            </button>
                            <p class="gt-login-text">
                                ¿Aún no tienes cuenta?
                                <a href="crear-cuenta.html">
                                    Regístrate
                                </a>
                            </p>
                        </div>
                        <p class="gt-form-note" id="gt-form-note">
                            Maquetación de ejemplo. No se envían datos.
                        </p>
                    </form>
                </section>
            </main>
            <footer class="gt-footer">
                <div class="gt-container gt-footer-inner">
                    <a class="gt-brand" href="crear-cuenta.html">
                        GLOBALTICKET
                    </a>
                    <div class="gt-footer-links">
                        <span>
                            Eventos
                        </span>
                        <span>
                            Ayuda
                        </span>
                        <span>
                            Términos y condiciones
                        </span>
                    </div>
                    <p class="gt-copyright">
                        © 2026 GlobalTicket
                    </p>
                </div>
            </footer>
        </div>
    </body>
</html>
