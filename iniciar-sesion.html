<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Pantalla de inicio de sesión de GlobalTicket basada en el diseño de Figma.">
 <title>Iniciar sesión | GlobalTicket</title>
 <style>
html, body { margin: 0; min-height: 100%; }

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
#gt-login-preview { --gt-primary:#6d28d9; --gt-dark:#4c1d95; --gt-header:#2a1050; --gt-background:#f5f5f5; --gt-muted:#6b7280; color-scheme:light; color:#000; background:var(--gt-background); font-family:Inter,Arial,sans-serif; font-size:16px; line-height:1.5; }
#gt-login-preview *, #gt-login-preview *::before, #gt-login-preview *::after { box-sizing:border-box; }
#gt-login-preview .gt-page { min-height:1024px; display:flex; flex-direction:column; }
#gt-login-preview .gt-container { width:calc(100% - 48px); max-width:1120px; margin-inline:auto; }
#gt-login-preview .gt-header { background:var(--gt-header); color:#fff; }
#gt-login-preview .gt-header-inner { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
#gt-login-preview .gt-brand { color:inherit; font-size:16px; font-weight:600; text-decoration:none; white-space:nowrap; }
#gt-login-preview .gt-search { width:400px; max-width:42%; height:40px; padding:0 16px; display:flex; align-items:center; gap:8px; border-radius:20px; background:#fff; margin:0; }
#gt-login-preview .gt-search img { width:19px; height:19px; flex:0 0 19px; }
#gt-login-preview .gt-search input { min-width:0; width:100%; height:100%; border:0; background:transparent; color:#374151; font:400 14px/24px Inter,Arial,sans-serif; }
#gt-login-preview .gt-search input::placeholder { color:rgba(136,136,136,.53); opacity:1; }
#gt-login-preview .gt-button { border:0; border-radius:8px; color:#fff; background:var(--gt-primary); font:500 16px/24px Inter,Arial,sans-serif; display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 16px; text-decoration:none; transition:background .2s ease; }
#gt-login-preview .gt-button:hover { background:var(--gt-dark); }
#gt-login-preview .gt-signin { white-space:nowrap; min-width:120px; }
#gt-login-preview .gt-avatar { width:40px; height:40px; display:block; border-radius:50%; flex:0 0 40px; }
#gt-login-preview .gt-main { flex:1; padding:16px 24px 48px; display:flex; justify-content:center; align-items:flex-start; }
#gt-login-preview .gt-registration { width:440px; max-width:100%; height:560px; padding:24px 24px 21px; border-radius:16px; background:#fff; box-shadow:0 4px 16px rgba(27,21,48,.08); display:flex; flex-direction:column; }
#gt-login-preview .gt-title { padding:0; margin:0; color:#000; text-align:center; font:700 32px/39px Inter,Arial,sans-serif; }
#gt-login-preview .gt-form { display:flex; flex-direction:column; flex:1; min-height:0; margin:0; }
#gt-login-preview .gt-field { width:400px; max-width:calc(100% + 8px); margin-left:-24px; padding:16px; display:flex; flex-direction:column; gap:8px; }
#gt-login-preview .gt-field label { color:#0f0f14; font-size:14px; line-height:24px; }
#gt-login-preview .gt-field input { width:100%; min-width:0; height:48px; padding:10px 16px; border:1px solid var(--gt-muted); border-radius:8px; background:#fff; color:#0f0f14; font:400 16px/24px Inter,Arial,sans-serif; }
#gt-login-preview .gt-field input::placeholder { color:var(--gt-muted); opacity:1; }
#gt-login-preview .gt-actions { margin-top:auto; display:flex; flex-direction:column; gap:16px; text-align:center; }
#gt-login-preview .gt-register { width:100%; }
#gt-login-preview .gt-login-text { margin:0; color:var(--gt-muted); font-size:14px; line-height:24px; }
#gt-login-preview .gt-login-text a { color:inherit; text-decoration:none; }
#gt-login-preview .gt-login-text a:hover { text-decoration:underline; }
#gt-login-preview .gt-footer { background:var(--gt-dark); color:#fff; }
#gt-login-preview .gt-footer-inner { min-height:120px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
#gt-login-preview .gt-footer-nav { display:flex; align-items:center; gap:32px; flex-wrap:wrap; }
#gt-login-preview .gt-footer-nav a { font-size:14px; line-height:24px; text-decoration:none; color:#fff; }
#gt-login-preview .gt-footer-nav a:hover { text-decoration:underline; }
#gt-login-preview .gt-copyright { color:#eeddee; margin:0; font-size:14px; line-height:24px; white-space:nowrap; }
#gt-login-preview .gt-feedback { display:none; margin:12px 0 0; border-radius:8px; padding:10px 12px; color:#4c1d95; background:#ede9fe; font-size:14px; line-height:20px; }
#gt-login-preview .gt-feedback:not(:empty) { display:block; }
@media (max-width:1100px) {
 #gt-login-preview .gt-page { min-height:900px; }
}
@media (max-width:760px) {
 #gt-login-preview .gt-header-inner { flex-wrap:wrap; gap:16px; padding-block:16px; }
 #gt-login-preview .gt-search { order:4; flex:1 0 100%; width:100%; max-width:100%; }
 #gt-login-preview .gt-signin { margin-left:auto; }
 #gt-login-preview .gt-footer-inner { flex-wrap:wrap; padding-block:24px; justify-content:center; text-align:center; }
 #gt-login-preview .gt-footer-nav { justify-content:center; gap:16px 24px; }
 #gt-login-preview .gt-copyright { width:100%; }
}
@media (max-width:480px) {
 #gt-login-preview .gt-page { min-height:812px; }
 #gt-login-preview .gt-container { width:calc(100% - 32px); }
 #gt-login-preview .gt-header-inner { gap:12px; }
 #gt-login-preview .gt-header .gt-brand { font-size:14px; }
 #gt-login-preview .gt-signin { min-width:0; padding-inline:12px; font-size:14px; }
 #gt-login-preview .gt-avatar { width:32px; height:32px; flex-basis:32px; }
 #gt-login-preview .gt-main { padding:24px 16px 32px; }
 #gt-login-preview .gt-registration { padding:24px 20px 21px; }
 #gt-login-preview .gt-title { font-size:28px; line-height:36px; }
 #gt-login-preview .gt-field { width:100%; max-width:100%; margin-left:0; padding:16px 0; }
 #gt-login-preview .gt-footer-inner { gap:16px; }
}

#gt-login-preview .cursor-interaction { cursor: pointer; }
    
#gt-login-preview .gt-header { border:1px solid #000; }
#gt-login-preview .gt-main { align-items:center; padding:32px 24px; }
#gt-login-preview .gt-registration { height:auto; min-height:0; padding:32px; border-radius:12px; border:1px solid #e5e5e5; }
#gt-login-preview .gt-title { font-size:24px; line-height:32px; color:#0f0f14; }
#gt-login-preview .gt-form { margin-top:16px; gap:16px; }
#gt-login-preview .gt-field { width:100%; max-width:100%; margin:0; padding:0; }
#gt-login-preview .gt-field input { height:44px; padding:8px 16px; }
#gt-login-preview .gt-actions { margin:0; padding-top:8px; }
#gt-login-preview .gt-login-text { color:#374151; }
#gt-login-preview .gt-login-text a { color:#6d28d9; font-weight:700; }
@media (max-width:480px) {
 #gt-login-preview .gt-main { padding:32px 16px; }
 #gt-login-preview .gt-registration { padding:24px; }
}
</style>
</head>

    <h1 class="gt-title" id="gt-login-heading">Iniciar sesión</h1>

<script>
(function () {
 const root = document.getElementById('gt-login-preview');
 const feedback = root.querySelector('.gt-feedback');
 root.querySelector('.gt-form').addEventListener('submit', function (event) {
  event.preventDefault();
  feedback.textContent = 'Vista previa: no se inicia una sesión real ni se guardan tus datos.';
 });
 root.querySelector('.gt-search').addEventListener('submit', function (event) {
  event.preventDefault();
 });
 root.querySelectorAll('[data-local]').forEach(function (link) {
  link.addEventListener('click', function (event) {
