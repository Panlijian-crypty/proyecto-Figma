<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pantalla de crear cuenta de GlobalTicket, basada en el diseño de Figma.">
    <title>Crear cuenta | GlobalTicket</title>
    <style>
html, body { margin: 0; min-height: 100%; }

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
#gt-crear-preview { --gt-primary:#6d28d9; --gt-dark:#4c1d95; --gt-header:#2a1050; --gt-background:#f5f5f5; --gt-muted:#6b7280; color-scheme:light; color:#000; background:var(--gt-background); font-family:Inter,Arial,sans-serif; font-size:16px; line-height:1.5; }
#gt-crear-preview *, #gt-crear-preview *::before, #gt-crear-preview *::after { box-sizing:border-box; }
#gt-crear-preview .gt-page { min-height:1024px; display:flex; flex-direction:column; }
#gt-crear-preview .gt-container { width:calc(100% - 48px); max-width:1120px; margin-inline:auto; }
#gt-crear-preview .gt-header { background:var(--gt-header); color:#fff; }
#gt-crear-preview .gt-header-inner { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
#gt-crear-preview .gt-brand { color:inherit; font-size:16px; font-weight:600; text-decoration:none; white-space:nowrap; }
#gt-crear-preview .gt-search { width:400px; max-width:42%; height:40px; padding:0 16px; display:flex; align-items:center; gap:8px; border-radius:20px; background:#fff; margin:0; }
#gt-crear-preview .gt-search img { width:19px; height:19px; flex:0 0 19px; }
#gt-crear-preview .gt-search input { min-width:0; width:100%; height:100%; border:0; background:transparent; color:#374151; font:400 14px/24px Inter,Arial,sans-serif; }
#gt-crear-preview .gt-search input::placeholder { color:rgba(136,136,136,.53); opacity:1; }
#gt-crear-preview .gt-button { border:0; border-radius:8px; color:#fff; background:var(--gt-primary); font:500 16px/24px Inter,Arial,sans-serif; display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 16px; text-decoration:none; transition:background .2s ease; }
#gt-crear-preview .gt-button:hover { background:var(--gt-dark); }
#gt-crear-preview .gt-signin { white-space:nowrap; min-width:120px; }
#gt-crear-preview .gt-avatar { width:40px; height:40px; display:block; border-radius:50%; flex:0 0 40px; }
#gt-crear-preview .gt-main { flex:1; padding:16px 24px 48px; display:flex; justify-content:center; align-items:flex-start; }
#gt-crear-preview .gt-registration { width:440px; max-width:100%; height:560px; padding:24px 24px 21px; border-radius:16px; background:#fff; box-shadow:0 4px 16px rgba(27,21,48,.08); display:flex; flex-direction:column; }
#gt-crear-preview .gt-title { padding:0; margin:0; color:#000; text-align:center; font:700 32px/39px Inter,Arial,sans-serif; }
#gt-crear-preview .gt-form { display:flex; flex-direction:column; flex:1; min-height:0; margin:0; }
#gt-crear-preview .gt-field { width:400px; max-width:calc(100% + 8px); margin-left:-24px; padding:16px; display:flex; flex-direction:column; gap:8px; }
#gt-crear-preview .gt-field label { color:#0f0f14; font-size:14px; line-height:24px; }
#gt-crear-preview .gt-field input { width:100%; min-width:0; height:48px; padding:10px 16px; border:1px solid var(--gt-muted); border-radius:8px; background:#fff; color:#0f0f14; font:400 16px/24px Inter,Arial,sans-serif; }
#gt-crear-preview .gt-field input::placeholder { color:var(--gt-muted); opacity:1; }
#gt-crear-preview .gt-actions { margin-top:auto; display:flex; flex-direction:column; gap:16px; text-align:center; }
#gt-crear-preview .gt-register { width:100%; }
#gt-crear-preview .gt-login-text { margin:0; color:var(--gt-muted); font-size:14px; line-height:24px; }
#gt-crear-preview .gt-login-text a { color:inherit; text-decoration:none; }
#gt-crear-preview .gt-login-text a:hover { text-decoration:underline; }
#gt-crear-preview .gt-footer { background:var(--gt-dark); color:#fff; }
#gt-crear-preview .gt-footer-inner { min-height:120px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
#gt-crear-preview .gt-footer-nav { display:flex; align-items:center; gap:32px; flex-wrap:wrap; }
#gt-crear-preview .gt-footer-nav a { font-size:14px; line-height:24px; text-decoration:none; color:#fff; }
#gt-crear-preview .gt-footer-nav a:hover { text-decoration:underline; }
#gt-crear-preview .gt-copyright { color:#eeddee; margin:0; font-size:14px; line-height:24px; white-space:nowrap; }
#gt-crear-preview .gt-feedback { display:none; margin:12px 0 0; border-radius:8px; padding:10px 12px; color:#4c1d95; background:#ede9fe; font-size:14px; line-height:20px; }
#gt-crear-preview .gt-feedback:not(:empty) { display:block; }
@media (max-width:1100px) {
 #gt-crear-preview .gt-page { min-height:900px; }
}
@media (max-width:760px) {
 #gt-crear-preview .gt-header-inner { flex-wrap:wrap; gap:16px; padding-block:16px; }
 #gt-crear-preview .gt-search { order:4; flex:1 0 100%; width:100%; max-width:100%; }
 #gt-crear-preview .gt-signin { margin-left:auto; }
 #gt-crear-preview .gt-footer-inner { flex-wrap:wrap; padding-block:24px; justify-content:center; text-align:center; }
 #gt-crear-preview .gt-footer-nav { justify-content:center; gap:16px 24px; }
 #gt-crear-preview .gt-copyright { width:100%; }
}
@media (max-width:480px) {
 #gt-crear-preview .gt-page { min-height:812px; }
 #gt-crear-preview .gt-container { width:calc(100% - 32px); }
 #gt-crear-preview .gt-header-inner { gap:12px; }
 #gt-crear-preview .gt-header .gt-brand { font-size:14px; }
 #gt-crear-preview .gt-signin { min-width:0; padding-inline:12px; font-size:14px; }
 #gt-crear-preview .gt-avatar { width:32px; height:32px; flex-basis:32px; }
 #gt-crear-preview .gt-main { padding:24px 16px 32px; }
 #gt-crear-preview .gt-registration { padding:24px 20px 21px; }
 #gt-crear-preview .gt-title { font-size:28px; line-height:36px; }
 #gt-crear-preview .gt-field { width:100%; max-width:100%; margin-left:0; padding:16px 0; }
 #gt-crear-preview .gt-footer-inner { gap:16px; }
}

#gt-crear-preview .cursor-interaction { cursor: pointer; }
    </style>
</head>

  <main class="gt-main">
   <section class="gt-registration" aria-labelledby="gt-register-heading">
    <h1 class="gt-title" id="gt-register-heading">Crear Cuenta</h1>
    <form class="gt-form" aria-label="Crear cuenta">
     <div class="gt-field">
      <label for="gt-full-name">Nombre Completo</label>
      <input id="gt-full-name" name="nombre" autocomplete="name" type="text" placeholder="José Manuel Osorio" required>
     </div>

      <button class="gt-button gt-register cursor-interaction" type="submit">Registrarme</button>

    </nav>

   </div>
  </footer>

</div>
<script>
(function () {
 const root = document.getElementById('gt-crear-preview');
 const feedback = root.querySelector('.gt-feedback');
 root.querySelector('.gt-form').addEventListener('submit', function (event) {
  event.preventDefault();
  feedback.textContent = 'Vista previa: los datos no se guardan ni se crea una cuenta.';
 });
 root.querySelector('.gt-search').addEventListener('submit', function (event) {
  event.preventDefault();
 });
 root.querySelectorAll('[data-local]').forEach(function (link) {
  link.addEventListener('click', function (event) {
   event.preventDefault();
   feedback.textContent = 'Esta vista previa incluye únicamente la pantalla Crear cuenta.';
  });
 });
})();
</script>
